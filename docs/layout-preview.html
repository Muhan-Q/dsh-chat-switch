<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-chat-switch · 版式预览</title>
<style>
  :root {
    --dsw-alias-bg-base: #ffffff;
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: rgba(127,127,127,.10);
    --dsw-alias-bg-overlay: #ffffff;
    --dsw-alias-label-primary: #16181d;
    --dsw-alias-label-secondary: #6b7280;
    --dsw-alias-label-tertiary: #9aa0a8;
    --dsw-alias-border-l1: rgba(22,24,29,.12);
    --dsw-alias-border-l2: rgba(22,24,29,.22);
    --dsw-alias-brand-primary: #4d6bfe;
    --dsw-alias-state-error-primary: #e5484d;
  }
  html, body { margin:0; height:100%; background:#f6f7f9; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  .stage { display:flex; height:100vh; }
  .frame { flex:1; display:flex; flex-direction:column; min-width:0; background:#fff; margin:16px; border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.08); overflow:hidden; }
  .frame-tag { font: 11px/1 -apple-system, "Segoe UI", sans-serif; color:#8a8f98; padding:8px 12px; border-bottom:1px solid rgba(0,0,0,.06); }
  
.csx-newcol { display:flex; flex-direction:column; gap:6px; flex:1 1 auto; min-width:0; }
.csx-switch-row { display:flex; align-items:center; gap:6px; width:100%; min-width:0; }
.csx-seg { display:inline-flex; align-items:center; gap:2px; padding:2px; border-radius:8px; width:100%; box-sizing:border-box;
  background: var(--dsw-alias-bg-layer-2, rgba(127,127,127,.12)); border:1px solid var(--dsw-alias-border-l1, transparent); }
.csx-seg-btn { appearance:none; border:0; background:transparent; color: var(--dsw-alias-label-secondary, #888);
  font: inherit; font-size:12px; line-height:18px; padding:3px 8px; border-radius:6px; cursor:pointer; white-space:nowrap;
  flex:1 1 0; text-align:center; }
.csx-seg-btn[data-active="true"] { background: var(--dsw-alias-bg-overlay, rgba(127,127,127,.22));
  color: var(--dsw-alias-label-primary, #111); font-weight:600; }
.csx-overlay { position:fixed; left:12px; top:68px; z-index:60; width:250px; box-sizing:border-box;
  padding:4px; border-radius:10px; pointer-events:auto;
  background: var(--dsw-alias-bg-overlay, rgba(255,255,255,.92)); border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25));
  box-shadow: 0 6px 18px rgba(0,0,0,.16); }
html[data-sidebar-collapsed="true"] .csx-overlay { display:none; }
.csx-panel { position:relative; display:flex; flex-direction:column; height:100%; min-height:0; }
.csx-head { display:flex; align-items:center; gap:6px; padding:6px 8px 4px; }
.csx-title { font-size:12px; font-weight:600; color: var(--dsw-alias-label-primary, #111); flex:1 1 auto; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.csx-icon-btn { appearance:none; border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25)); background:transparent;
  color: var(--dsw-alias-label-secondary, #888); border-radius:6px; width:22px; height:22px; line-height:1; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; font-size:12px; padding:0; }
.csx-icon-btn:hover { background: var(--dsw-alias-bg-layer-2, rgba(127,127,127,.12)); }
.csx-account { display:flex; align-items:center; gap:6px; padding:2px 8px 6px; font-size:11px;
  color: var(--dsw-alias-label-secondary, #888); }
.csx-dot { width:6px; height:6px; border-radius:50%; background: var(--dsw-alias-state-success-primary, #2a2); flex:none; }
.csx-dot[data-off="true"] { background: var(--dsw-alias-state-idle-primary, #999); }
.csx-badge { font-size:10px; padding:0 5px; border-radius:999px; border:1px solid var(--dsw-alias-border-l2, rgba(127,127,127,.3));
  color: var(--dsw-alias-label-secondary, #888); }
.csx-badge[data-ok="true"] { color: var(--dsw-alias-state-success-primary, #2a2); border-color: currentColor; }
.csx-search { margin:0 8px 6px; display:flex; align-items:center; gap:4px; }
.csx-input { flex:1 1 auto; min-width:0; box-sizing:border-box; font: inherit; font-size:12px; padding:4px 8px;
  border-radius:6px; border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25));
  background: var(--dsw-alias-bg-layer-1, transparent); color: var(--dsw-alias-label-primary, #111); outline:none; }
.csx-input:focus { border-color: var(--dsw-alias-brand-primary, #4a7); }
.csx-list { flex:1 1 auto; min-height:0; overflow-y:auto; padding:0 4px 8px; }
.csx-row { display:flex; align-items:center; gap:6px; width:100%; box-sizing:border-box; text-align:left;
  appearance:none; border:0; background:transparent; color: var(--dsw-alias-label-primary, #111); font: inherit;
  font-size:12px; padding:5px 30px 5px 6px; border-radius:6px; cursor:pointer; }
.csx-row:hover { background: var(--dsw-alias-bg-layer-2, rgba(127,127,127,.12)); }
.csx-row[data-active="true"] { background: var(--dsw-alias-bg-layer-2, rgba(127,127,127,.18)); font-weight:600; }
.csx-row-title { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.csx-row-time { flex:none; font-size:10px; color: var(--dsw-alias-label-secondary, #888); }
.csx-pin { flex:none; font-size:10px; color: var(--dsw-alias-brand-primary, #4a7); }
.csx-empty { padding:12px 10px; font-size:11px; line-height:1.5; color: var(--dsw-alias-label-secondary, #888); }
.csx-error { margin:4px 8px; padding:6px 8px; border-radius:6px; font-size:11px; line-height:1.45;
  color: var(--dsw-alias-state-error-primary, #d33); border:1px solid currentColor; word-break:break-word; }
.csx-foot { display:flex; align-items:center; gap:6px; padding:6px 8px; border-top:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.18)); }
.csx-link { appearance:none; border:0; background:transparent; color: var(--dsw-alias-brand-primary, #4a7); font: inherit;
  font-size:11px; cursor:pointer; padding:2px 0; }
.csx-card > div[style*="flex"] { flex-wrap: wrap; }
.csx-card { margin:8px; padding:10px; border-radius:10px; border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25));
  background: var(--dsw-alias-bg-layer-1, transparent); font-size:11px; line-height:1.6; color: var(--dsw-alias-label-secondary, #888); }
.csx-card h4 { margin:0 0 6px; font-size:12px; color: var(--dsw-alias-label-primary, #111); }
.csx-card ol { margin:4px 0 8px; padding-left:16px; }
.csx-card code { font-family: ui-monospace, monospace; font-size:10px; }
.csx-btn { appearance:none; border:1px solid var(--dsw-alias-border-l2, rgba(127,127,127,.3)); border-radius:6px;
  background: var(--dsw-alias-bg-layer-2, rgba(127,127,127,.1)); color: var(--dsw-alias-label-primary, #111);
  font: inherit; font-size:11px; padding:4px 10px; cursor:pointer; }
.csx-btn[data-primary="true"] { background: var(--dsw-alias-brand-primary, #4a7); border-color: transparent; color:#fff; font-weight:600; }
.csx-btn:disabled { opacity:.5; cursor:default; }
.csx-main { display:flex; flex-direction:column; height:100%; min-height:0; background: var(--dsw-alias-bg-base, transparent); }
.csx-main-head { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.18)); }
.csx-main-title { font-size:13px; font-weight:600; color: var(--dsw-alias-label-primary, #111); flex:1 1 auto; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.csx-main-body { flex:1 1 auto; min-height:0; overflow-y:auto; padding:16px 18px 24px; }
.csx-newweb { appearance:none; width:100%; box-sizing:border-box; height:38px; padding:0 12px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  font: inherit; font-size:14px; font-weight:400; color: var(--dsw-alias-label-primary, #111);
  border:0.5px solid var(--dsw-alias-border-l3, rgba(127,127,127,.3)); border-radius: var(--dsw-radius-md, 12px);
  background: var(--dsw-alias-bg-base, transparent); }
.csx-newweb:hover { background: var(--dsw-alias-bg-layer-2, rgba(127,127,127,.12)); }
.csx-files { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:4px; }
.csx-msg-thumb { width:72px; height:72px; object-fit:cover; border-radius:8px; cursor:zoom-in;
  border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.2)); }
.csx-attach-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
.csx-attach { position:relative; display:flex; align-items:center; gap:6px; max-width:190px;
  padding:4px 8px 4px 4px; border-radius:10px; border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25));
  background: var(--dsw-alias-bg-layer-1, transparent); }
.csx-attach-thumb { width:36px; height:36px; object-fit:cover; border-radius:8px; flex:none; }
.csx-attach-icon { width:36px; height:36px; display:flex; align-items:center; justify-content:center; font-size:18px; flex:none; }
.csx-attach-name { font-size:11px; color: var(--dsw-alias-label-secondary, #888); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:110px; }
.csx-attach-remove { appearance:none; border:0; background:transparent; color: var(--dsw-alias-label-secondary, #888);
  font-size:13px; line-height:1; cursor:pointer; padding:0 2px; }
.csx-file { font-size:11px; padding:1px 6px; border-radius:999px; border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25));
  color: var(--dsw-alias-label-secondary, #888); }
.csx-composer { flex:none; padding:8px 12px 12px; border-top:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.18));
  background: var(--dsw-alias-bg-base, transparent); }
.csx-composer-hint { font-size:11px; line-height:1.45; color: var(--dsw-alias-label-secondary, #888); margin:0 0 6px; }
.csx-textarea { width:100%; box-sizing:border-box; resize:none; font: inherit; font-size:13px; line-height:1.5;
  padding:8px 10px; border-radius:10px; border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25));
  background: var(--dsw-alias-bg-layer-1, transparent); color: var(--dsw-alias-label-primary, #111); outline:none; }
.csx-textarea:focus { border-color: var(--dsw-alias-brand-primary, #4a7); }
.csx-composer-bar { display:flex; align-items:center; gap:6px; margin-top:6px; }
.csx-chip { appearance:none; border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25)); background:transparent;
  color: var(--dsw-alias-label-secondary, #888); font: inherit; font-size:11px; padding:3px 8px; border-radius:999px; cursor:pointer; }
.csx-chip[data-on="true"] { color: var(--dsw-alias-brand-primary, #4a7); border-color: currentColor;
  background: color-mix(in srgb, currentColor 12%, transparent); }
.csx-msg { display:flex; flex-direction:column; gap:4px; margin:0 auto 16px; max-width:820px; }
.csx-msg-role { font-size:11px; color: var(--dsw-alias-label-secondary, #888); }
.csx-bubble { border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.6; white-space:pre-wrap; word-break:break-word;
  color: var(--dsw-alias-label-primary, #111); background: var(--dsw-alias-bg-layer-1, rgba(127,127,127,.06));
  border:1px solid var(--dsw-alias-border-l1, transparent); }
.csx-msg[data-role="user"] .csx-bubble { background: var(--dsw-alias-bg-layer-2, rgba(127,127,127,.12)); }
.csx-think { margin-top:6px; font-size:11px; color: var(--dsw-alias-label-secondary, #888); }
.csx-think summary { cursor:pointer; }
.csx-think div { margin-top:4px; white-space:pre-wrap; max-height:220px; overflow:auto; }
.csx-center { margin:auto; padding:32px; text-align:center; font-size:12px; line-height:1.7; color: var(--dsw-alias-label-secondary, #888); }
/* ---- conversation bubbles: user right, assistant left ---- */
.csx-main-head { height:60px; padding:0 16px; box-sizing:border-box; }
.csx-main-title { font-size:14px; font-weight:600; }
.csx-msg { width:100%; margin:0 auto 18px; max-width:860px; display:flex; flex-direction:column; gap:4px; align-items:flex-start; }
.csx-msg[data-role="user"] { align-items:flex-end; }
.csx-msg-role { font-size:11px; color: var(--dsw-alias-label-secondary, #888); }
.csx-md-body { white-space:normal; }
.csx-md-p { margin:0; line-height:1.72; }
.csx-md-h1 { margin:4px 0 0; font-size:17px; line-height:1.4; }
.csx-md-h2 { margin:4px 0 0; font-size:15px; line-height:1.45; }
.csx-md-h3 { margin:2px 0 0; font-size:14px; line-height:1.5; }
.csx-md-h4 { margin:2px 0 0; font-size:13px; line-height:1.5; }
.csx-md-list { margin:0; padding-left:20px; line-height:1.7; }
.csx-md-list li { margin:2px 0; }
.csx-md-pre { margin:2px 0; padding:10px 12px; border-radius:8px; overflow:auto; font-size:12px; line-height:1.55;
  background: var(--dsw-alias-bg-layer-2, rgba(127,127,127,.1)); }
.csx-md-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; padding:1px 4px;
  border-radius:4px; background: var(--dsw-alias-bg-layer-2, rgba(127,127,127,.12)); }
.csx-md-quote { margin:2px 0; padding-left:10px; border-left:3px solid var(--dsw-alias-border-l2, rgba(127,127,127,.35));
  color: var(--dsw-alias-label-secondary, #888); }
.csx-md-hr { border:0; border-top:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25)); margin:6px 0; }
.csx-md-link { color: var(--dsw-alias-brand-primary, #4a7); text-decoration:none; }
.csx-bubble { max-width:min(86%, 720px); border-radius:12px; padding:10px 12px; font-size:13px; line-height:1.6;
  white-space:pre-wrap; word-break:break-word; color: var(--dsw-alias-label-primary, #111);
  background: var(--dsw-alias-bg-layer-1, rgba(127,127,127,.06));
  border:1px solid var(--dsw-alias-border-l1, transparent); }
.csx-msg[data-role="user"] .csx-bubble { background: color-mix(in srgb, var(--dsw-alias-brand-primary, #4a7) 14%, transparent); border-color: transparent; }
.csx-caret { display:inline-block; margin-left:2px; opacity:.7; animation: csx-blink 1s steps(2) infinite; }
@keyframes csx-blink { 50% { opacity:0 } }
/* ---- collapsible thinking ---- */
.csx-think { margin:0 0 6px; font-size:11px; color: var(--dsw-alias-label-secondary, #888); }
.csx-think summary { cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:4px;
  padding:2px 8px; border-radius:999px; border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25)); }
.csx-think summary::-webkit-details-marker { display:none; }
.csx-think summary::after { content:'▾'; font-size:9px; opacity:.7; }
.csx-think[open] summary::after { content:'▴'; }
.csx-think-body { margin-top:6px; padding:8px 10px; border-radius:8px; background: var(--dsw-alias-bg-layer-2, rgba(127,127,127,.08));
  white-space:pre-wrap; max-height:240px; overflow:auto; }
/* ---- attachments ---- */
.csx-attach-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; align-items:flex-end; }
.csx-attach-image { position:relative; width:96px; height:96px; border-radius:10px; overflow:hidden;
  border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25)); }
.csx-attach-thumb-lg { width:100%; height:100%; object-fit:cover; cursor:zoom-in; display:block; }
.csx-attach-file { position:relative; display:flex; align-items:center; gap:6px; max-width:220px;
  padding:6px 10px; border-radius:10px; border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25));
  background: var(--dsw-alias-bg-layer-1, transparent); }
.csx-attach-icon-lg { font-size:20px; }
.csx-attach-name { font-size:11px; color: var(--dsw-alias-label-secondary, #888); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
.csx-attach-remove { position:absolute; top:2px; right:2px; width:18px; height:18px; line-height:1; border:0; border-radius:50%;
  background: rgba(0,0,0,.45); color:#fff; font-size:12px; cursor:pointer; padding:0; }
.csx-lightbox { position:fixed; top:0; right:0; bottom:0; left:0; z-index:90; background:rgba(0,0,0,.82); display:flex; align-items:center; justify-content:center; padding:16px; }
.csx-lightbox-img { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }
/* ---- conversation management ---- */
.csx-row-wrap { position:relative; }
.csx-icon-btn[data-active="true"] { color: var(--dsw-alias-brand-primary, #4a7); border-color: currentColor; }
.csx-row-more { position:absolute; right:2px; top:50%; transform:translateY(-50%); appearance:none; border:0;
  background: var(--dsw-alias-bg-layer-2, rgba(127,127,127,.14)); color: var(--dsw-alias-label-secondary, #888);
  border-radius:6px; width:22px; height:22px; cursor:pointer; font-size:13px; line-height:1; padding:0; }
.csx-row-menu { position:absolute; right:2px; top:calc(50% + 14px); z-index:20; min-width:112px; padding:4px;
  border-radius:10px; background: var(--dsw-alias-bg-overlay, #fff); border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25));
  box-shadow: 0 8px 24px rgba(0,0,0,.16); }
.csx-menu-item { display:block; width:100%; text-align:left; appearance:none; border:0; background:transparent;
  font: inherit; font-size:12px; padding:6px 10px; border-radius:6px; cursor:pointer; color: var(--dsw-alias-label-primary, #111); }
.csx-menu-item:hover { background: var(--dsw-alias-bg-layer-2, rgba(127,127,127,.12)); }
.csx-menu-danger { color: var(--dsw-alias-state-error-primary, #d33); }
.csx-check { width:16px; height:16px; border-radius:50%; border:1px solid var(--dsw-alias-border-l2, rgba(127,127,127,.4));
  display:inline-flex; align-items:center; justify-content:center; font-size:10px; flex:none; }
.csx-check[data-on="true"] { background: var(--dsw-alias-brand-primary, #4a7); border-color: transparent; color:#fff; }
.csx-manage-bar { display:flex; align-items:center; gap:8px; margin:0 8px 6px; padding:6px 8px; border-radius:10px;
  border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25)); background: var(--dsw-alias-bg-layer-1, transparent); }
.csx-group { display:flex; flex-direction:column; }
.csx-group-label { padding:8px 6px 2px; font-size:11px; color: var(--dsw-alias-label-secondary, #888); }
.csx-manage-sticky { position:sticky; bottom:0; z-index:30; margin:6px 2px; border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25)); background: var(--dsw-alias-bg-overlay, #fff); box-shadow: 0 6px 18px rgba(0,0,0,.14); }
.csx-confirm-mask { pointer-events:auto; position:fixed; top:0; right:0; bottom:0; left:0; z-index:9999;
  background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; }
.csx-confirm { width:min(92vw, 380px); box-sizing:border-box; border-radius:16px; padding:22px 18px 18px;
  background: var(--dsw-alias-bg-overlay, #fff); box-shadow:0 18px 44px rgba(0,0,0,.30); text-align:center; }
.csx-confirm .csx-input { width:100%; box-sizing:border-box; height:44px; font-size:15px; text-align:center; margin-bottom:16px; }
.csx-confirm-title { font-size:16px; font-weight:600; line-height:1.4; color: var(--dsw-alias-label-primary, #111); margin-bottom:8px; text-align:center; }
.csx-confirm-text { font-size:13px; line-height:1.65; color: var(--dsw-alias-label-secondary, #888); margin-bottom:16px; text-align:center; }
.csx-confirm-actions { display:flex; gap:10px; justify-content:center; }
.csx-confirm-actions .csx-btn { min-width:104px; height:40px; font-size:14px; border-radius:10px; }
.csx-confirm-danger { background: var(--dsw-alias-state-error-primary, #e5484d) !important; border-color:transparent !important; color:#fff !important; }
.csx-manage-floating { position:sticky; top:0; z-index:15; margin:-2px 0 10px; border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.25));
  border-radius:10px; background: var(--dsw-alias-bg-overlay, #fff); box-shadow: 0 4px 14px rgba(0,0,0,.10); }
.csx-error-bottom { margin:0 0 6px; }
.csx-manage-count { font-size:11px; color: var(--dsw-alias-label-secondary, #888); }

/* ---- web-style chat surface (chat.deepseek.com layout) ---- */
.csx-web-scroll { flex:1 1 auto; min-height:0; overflow-y:auto; padding:22px 16px 10px; }
.csx-web-col { width:100%; max-width:760px; margin:0 auto; box-sizing:border-box; }
.csx-dock { flex:none; padding:6px 16px 14px; }
.csx-hero { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:20px; padding:24px 16px 40px; }
.csx-hero-head { display:flex; align-items:center; gap:10px; }
.csx-hero-mark { font-size:28px; line-height:1; }
.csx-hero-title { margin:0; font-size:21px; font-weight:600; letter-spacing:.2px; color: var(--dsw-alias-label-primary, #111); }
.csx-hero-card { width:100%; max-width:760px; }
.csx-card { box-sizing:border-box; display:flex; flex-direction:column; gap:6px; border-radius:18px;
  padding:12px 14px 8px; background: var(--dsw-alias-bg-layer-1, #fff);
  border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.26)); box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.csx-card[data-variant="hero"] { box-shadow: 0 8px 28px rgba(0,0,0,.09); }
.csx-textarea { width:100%; box-sizing:border-box; resize:none; border:0; outline:none; background:transparent;
  font: inherit; font-size:14px; line-height:1.6; color: var(--dsw-alias-label-primary, #111);
  min-height:26px; max-height:220px; padding:2px 2px 0; }
.csx-textarea::placeholder { color: var(--dsw-alias-label-tertiary, #aaa); }
.csx-card-bar { display:flex; align-items:center; gap:6px; }
.csx-tool { appearance:none; border:1px solid transparent; background:transparent; font: inherit; font-size:12px;
  color: var(--dsw-alias-label-secondary, #666); padding:4px 10px; border-radius:999px; cursor:pointer;
  display:inline-flex; align-items:center; gap:5px; line-height:1.4; }
.csx-tool:hover { background: var(--dsw-alias-bg-layer-2, rgba(127,127,127,.10)); }
.csx-tool[data-on="true"] { color: var(--dsw-alias-brand-primary, #4a7); border-color: currentColor;
  background: color-mix(in srgb, var(--dsw-alias-brand-primary, #4a7) 10%, transparent); }
.csx-tool-icon { width:30px; height:30px; justify-content:center; padding:0; font-size:15px; border-radius:50%;
  border-color: var(--dsw-alias-border-l1, rgba(127,127,127,.3)); color: var(--dsw-alias-label-secondary, #666); }
.csx-spacer { flex:1 1 auto; }
.csx-send { width:32px; height:32px; flex:none; border:0; border-radius:50%; cursor:pointer; color:#fff;
  display:inline-flex; align-items:center; justify-content:center; font-size:16px; line-height:1;
  background: var(--dsw-alias-brand-primary, #4d6bfe); transition: opacity .15s ease; }
.csx-send[disabled] { opacity:.45; cursor:default; }
.csx-send[data-stop="true"] { background: var(--dsw-alias-state-error-primary, #e5484d); }
.csx-web-col .csx-msg { width:100%; max-width:none; margin:0 0 22px; gap:6px; }
.csx-web-col .csx-msg .csx-msg-role { display:none; }
.csx-web-col .csx-bubble { max-width:100%; padding:0; border:0; background:transparent; font-size:14px; line-height:1.72; }
.csx-web-col .csx-msg[data-role="user"] { align-items:flex-end; }
.csx-web-col .csx-msg[data-role="user"] .csx-bubble { max-width:82%; padding:10px 14px; border-radius:14px;
  background: var(--dsw-alias-bg-layer-2, rgba(127,127,127,.10)); }
.csx-msg-foot { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:2px; }
.csx-msg-note { font-size:11px; color: var(--dsw-alias-label-tertiary, #999); }
.csx-sources { font-size:11px; color: var(--dsw-alias-label-secondary, #777); }
.csx-sources summary { cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:4px;
  padding:2px 10px; border-radius:999px; border:1px solid var(--dsw-alias-border-l1, rgba(127,127,127,.28)); }
.csx-sources summary::-webkit-details-marker { display:none; }
.csx-sources-list { margin:6px 0 0; padding-left:16px; display:flex; flex-direction:column; gap:3px; }
.csx-sources-list a { color: var(--dsw-alias-brand-primary, #4a7); text-decoration:none; }
.csx-sources-list a:hover { text-decoration:underline; }

</style>
</head>
<body><div class="stage"><div class="frame">
<div class="frame-tag">空态（hero）</div>
<div class="csx-main">
  <div class="csx-main-head"><span class="csx-main-title">Chat</span></div>
  <div class="csx-hero">
    <div class="csx-hero-head"><span class="csx-hero-mark">🐳</span><h1 class="csx-hero-title">你好，我能帮什么忙吗？</h1></div>
    <div class="csx-hero-card">
      <div class="csx-card" data-variant="hero">
        <textarea class="csx-textarea" rows="1" placeholder="给 DeepSeek 发送消息"></textarea>
        <div class="csx-card-bar">
          <label class="csx-tool csx-tool-icon" data-on="false">＋</label>
          <button class="csx-tool" data-on="true" type="button">◇ 深度思考</button>
          <button class="csx-tool" data-on="false" type="button">🌐 智能搜索</button>
          <span class="csx-spacer"></span>
          <button class="csx-send" type="button">↑</button>
        </div>
      </div>
    </div>
  </div>
</div>
</div></div><div class="stage"><div class="frame">
<div class="frame-tag">对话态（web 栏 + dock）</div>
<div class="csx-main">
  <div class="csx-main-head"><span class="csx-main-title">DSH 工作区无法选择</span><button class="csx-btn" type="button">在网页版打开</button></div>
  <div class="csx-web-scroll"><div class="csx-web-col">
    <div class="csx-msg" data-role="user"><div class="csx-bubble"><div class="csx-md-body">帮我看看 dsh 的工作区为什么选不了</div></div></div>
    <div class="csx-msg" data-role="assistant">
      <details class="csx-think"><summary>已深度思考（用时 12 秒）</summary><div class="csx-think-body">先看 sessions 目录…</div></details>
      <div class="csx-bubble"><div class="csx-md-body"><p>常见原因有三种：</p><p>1. 会话目录里有不合规的扁平 <code class="csx-md-code">.jsonl</code> 文件；</p><p>2. <code class="csx-md-code">workspace.json</code> 被写入了 BOM；</p><p>3. 目录名包含特殊字符。</p></div></div>
      <div class="csx-msg-foot">
        <span class="csx-msg-note">内容由 AI 生成，请仔细甄别</span>
      </div>
    </div>
    <div class="csx-msg" data-role="assistant">
      <div class="csx-bubble"><div class="csx-md-body"><p>建议先备份 <code class="csx-md-code">~/.dsh</code> 再逐个排除。</p></div></div>
      <div class="csx-msg-foot">
        <details class="csx-sources"><summary>14 个网页</summary><ul class="csx-sources-list"><li><a href="#">DSH 工作区选择问题讨论</a></li><li><a href="#">workspace.json BOM 修复</a></li></ul></details>
        <span class="csx-msg-note">内容由 AI 生成，请仔细甄别</span>
      </div>
    </div>
  </div></div>
  <div class="csx-dock"><div class="csx-web-col">
    <div class="csx-card" data-variant="dock">
      <textarea class="csx-textarea" rows="1" placeholder="给 DeepSeek 发送消息"></textarea>
      <div class="csx-card-bar">
        <label class="csx-tool csx-tool-icon" data-on="false">＋</label>
        <button class="csx-tool" data-on="true" type="button">◇ 深度思考</button>
        <button class="csx-tool" data-on="false" type="button">🌐 智能搜索</button>
        <span class="csx-spacer"></span>
        <button class="csx-send" type="button">↑</button>
      </div>
    </div>
  </div></div>
</div>
</div></div></body>
