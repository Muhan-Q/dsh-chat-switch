.csx-think { margin-top:6px; font-size:11px; color: var(--dsw-alias-label-secondary, #888); }

/* ---- conversation bubbles: user right, assistant left ---- */
.csx-main-head { height:60px; padding:0 16px; box-sizing:border-box; }
.csx-main-title { font-size:14px; font-weight:600; }
.csx-msg { width:100%; margin:0 auto 18px; max-width:860px; display:flex; flex-direction:column; gap:4px; align-items:flex-start; }

<script>
  // Mirror lib/client.js chatWidthAxis(): drag preference, else 64% of the column.
  function applyAxis() {
    let preference = null
    try {
      const value = Number(localStorage.getItem('dsh.conversation.contentWidth'))
      if (Number.isFinite(value) && value > 0) preference = value
    } catch {}
    for (const main of document.querySelectorAll('.csx-main')) {
      const column = main.clientWidth
      const max = Math.max(640, column - 176)
      const content = preference === null
        ? Math.max(680, Math.min(Math.round(column * 0.64), 920))
        : Math.min(Math.max(Math.round(preference), 640), max)
      main.style.setProperty('--csx-content-w', content + 'px')
      main.style.setProperty('--csx-card-w', content + 32 + 'px')
    }
  }
  applyAxis()
  window.addEventListener('resize', applyAxis)
</script>
